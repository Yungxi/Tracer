[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tracer-llm"
version = "0.1.0"
description = "Python code tracing tool with LLM-based output evaluation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Yungxi"}
]
keywords = ["tracer", "debugging", "llm", "code-analysis", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "openai>=1.0.0",
    "datasets>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Yungxi/Tracer"
Source = "https://github.com/Yungxi/Tracer"
"Bug Reports" = "https://github.com/Yungxi/Tracer/issues"

[project.scripts]
tracer = "tracer:main"

[tool.setuptools]
py-modules = [
    "tracer",
    "parser",
    "executor",
    "judge",
    "reporter",
    "patcher",
    "properties",
    "judge_property",
    "judge_test_property",
]

[tool.setuptools.package-data]
"*" = ["config.example.json", "README.md"]
